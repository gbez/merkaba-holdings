<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Fund Internship — Merkaba Holdings</title>
  <style>
    body {
      max-width: 700px;
      margin: 2.5rem auto;
      padding: 0 1.25rem;
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      color: #222;
    }
    h1, h2, h3 { line-height: 1.25; }
    ul { padding-left: 1.5rem; }
    li + li { margin-top: 0.35rem; }
    a { color: #0645ad; }
    #content[hidden] { display: none; }
    #error { display: none; }
  </style>
</head>
<body>
  <div id="content" hidden></div>
  <p id="error">Couldn't load the page content. Try refreshing.</p>

  <script>
    // Small, deliberately plain Markdown-to-HTML converter — just enough
    // for headings, paragraphs, bold/italic, links, and simple lists.
    function escapeHtml(text) {
      return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderInline(text) {
      let html = escapeHtml(text);
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      html = html.replace(/\\([\\`*_{}\[\]()#+.!>-])/g, "$1");
      return html;
    }

    function renderMarkdown(markdown) {
      const blocks = markdown.trim().split(/\n{2,}/);
      let html = "";

      for (const block of blocks) {
        const lines = block.split("\n");

        if (/^### /.test(lines[0])) {
          html += `<h3>${renderInline(lines[0].slice(4))}</h3>\n`;
        } else if (/^## /.test(lines[0])) {
          html += `<h2>${renderInline(lines[0].slice(3))}</h2>\n`;
        } else if (/^# /.test(lines[0])) {
          html += `<h1>${renderInline(lines[0].slice(2))}</h1>\n`;
        } else if (lines.every(l => /^\s*[-*]\s+/.test(l))) {
          let itemsHtml = "";
          let i = 0;
          while (i < lines.length) {
            const itemText = lines[i].replace(/^\s*[-*]\s+/, "");
            let li = `<li>${renderInline(itemText)}`;
            let j = i + 1;
            const nestedItems = [];
            while (j < lines.length && /^\s{2,}[-*]\s+/.test(lines[j])) {
              nestedItems.push(lines[j].replace(/^\s*[-*]\s+/, ""));
              j++;
            }
            if (nestedItems.length) {
              li += "<ul>" + nestedItems.map(t => `<li>${renderInline(t)}</li>`).join("") + "</ul>";
            }
            li += "</li>\n";
            itemsHtml += li;
            i = j;
          }
          html += `<ul>\n${itemsHtml}</ul>\n`;
        } else {
          html += `<p>${renderInline(lines.join(" "))}</p>\n`;
        }
      }
      return html;
    }

    fetch("../internship.md")
      .then(response => {
        if (!response.ok) throw new Error("fetch failed");
        return response.text();
      })
      .then(markdown => {
        document.getElementById("content").innerHTML = renderMarkdown(markdown);
        document.getElementById("content").hidden = false;
      })
      .catch(() => {
        document.getElementById("error").style.display = "block";
      });
  </script>
</body>
</html>
